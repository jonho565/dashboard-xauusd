name: atualizar-dados
on:
  schedule:
    - cron: 0,10,20,30,40,50 * * * *
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publicar-site
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar dados
        run: node scripts/atualizar.mjs
      - name: Registro diario
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            date -u +%Y-%m-%d > site/data/ultimo-dia.txt
            git config user.name bot-dados
            git config user.email bot-dados@users.noreply.github.com
            git add site/data/ultimo-dia.txt
            git commit -m registro-diario || true
            git push || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
